<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrievanceTrack</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            min-height: 100vh;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h3 {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        .total p {
            color: #4f46e5;
        }

        .open p {
            color: #f59e0b;
        }

        .resolved p {
            color: #16a34a;
        }

        .escalated p {
            color: #dc2626;
        }

        .form-section,
        .list-section {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 22px;
            color: #4f46e5;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #334155;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 5px rgba(99,102,241,0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            margin-top: 20px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .refresh-btn {
            background: #0f766e;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .OPEN {
            background: #fef3c7;
            color: #92400e;
        }

        .RESOLVED {
            background: #dcfce7;
            color: #166534;
        }

        .ESCALATED {
            background: #fee2e2;
            color: #991b1b;
        }

        .RECEIVED {
            background: #dbeafe;
            color: #1e40af;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>GRIEVANCETRACK</h1>
    <p>Citizen Complaint Tracking & SLA Escalation System</p>
</header>

<div class="container">

    <div class="cards">
        <div class="card total">
            <h3>Total Complaints</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="card open">
            <h3>Open Complaints</h3>
            <p id="openCount">0</p>
        </div>

        <div class="card resolved">
            <h3>Resolved</h3>
            <p id="resolvedCount">0</p>
        </div>

        <div class="card escalated">
            <h3>Escalated</h3>
            <p id="escalatedCount">0</p>
        </div>
    </div>

    <div class="form-section">
        <h2 class="section-title">📝 Submit New Grievance</h2>

        <form id="grievanceForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Citizen Name</label>
                    <input type="text" id="citizenName"
                           placeholder="Enter citizen name" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Road">Road</option>
                        <option value="Water">Water</option>
                        <option value="Garbage">Garbage</option>
                        <option value="Streetlight">Streetlight</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Description</label>
                    <textarea id="description"
                              placeholder="Describe your complaint"
                              required></textarea>
                </div>

                <div class="form-group full">
                    <label>Location</label>
                    <input type="text" id="location"
                           placeholder="Enter complaint location" required>
                </div>

            </div>

            <button type="submit" class="submit-btn">
                Submit Grievance
            </button>

            <div id="message" class="message"></div>

        </form>
    </div>

    <div class="list-section">

        <h2 class="section-title">📋 Complaint Records</h2>

        <button class="refresh-btn" onclick="loadGrievances()">
            🔄 Refresh Complaints
        </button>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Citizen</th>
                <th>Category</th>
                <th>Department</th>
                <th>Status</th>
                <th>Stage</th>
                <th>SLA</th>
                <th>Location</th>
            </tr>
            </thead>

            <tbody id="grievanceTable">
            </tbody>
        </table>

    </div>

</div>

<footer>
    GrievanceTrack © 2026 | Municipal Citizen Service System
</footer>

<script>

    const API = "/api/grievances";

    document.getElementById("grievanceForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const grievance = {
                citizenName: document.getElementById("citizenName").value,
                category: document.getElementById("category").value,
                description: document.getElementById("description").value,
                location: document.getElementById("location").value
            };

            try {

                const response = await fetch(API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(grievance)
                });

                if (!response.ok) {
                    throw new Error("Failed to submit grievance");
                }

                showMessage(
                    "Grievance submitted successfully!",
                    "#dcfce7",
                    "#166534"
                );

                document.getElementById("grievanceForm").reset();

                loadGrievances();

            } catch (error) {

                showMessage(
                    "Error submitting grievance!",
                    "#fee2e2",
                    "#991b1b"
                );

                console.error(error);
            }
        });


    async function loadGrievances() {

        try {

            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Failed to load grievances");
            }

            const data = await response.json();

            const table = document.getElementById("grievanceTable");

            table.innerHTML = "";

            let open = 0;
            let resolved = 0;
            let escalated = 0;

            data.forEach(grievance => {

                if (grievance.status === "OPEN") {
                    open++;
                }

                if (grievance.status === "RESOLVED") {
                    resolved++;
                }

                if (grievance.status === "ESCALATED") {
                    escalated++;
                }

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${grievance.id}</td>
                    <td>${grievance.citizenName}</td>
                    <td>${grievance.category}</td>
                    <td>${grievance.department || "-"}</td>
                    <td>
                        <span class="status ${grievance.status}">
                            ${grievance.status}
                        </span>
                    </td>
                    <td>
                        <span class="status ${grievance.stage}">
                            ${grievance.stage}
                        </span>
                    </td>
                    <td>${grievance.slaDays || "-"} Days</td>
                    <td>${grievance.location}</td>
                `;

                table.appendChild(row);
            });

            document.getElementById("totalCount").textContent = data.length;
            document.getElementById("openCount").textContent = open;
            document.getElementById("resolvedCount").textContent = resolved;
            document.getElementById("escalatedCount").textContent = escalated;

        } catch (error) {

            console.error(error);

        }
    }


    function showMessage(text, background, color) {

        const message = document.getElementById("message");

        message.textContent = text;
        message.style.display = "block";
        message.style.background = background;
        message.style.color = color;

        setTimeout(function() {
            message.style.display = "none";
        }, 3000);
    }


    loadGrievances();

</script>

</body>
</html>
